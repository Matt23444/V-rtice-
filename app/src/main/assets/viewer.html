<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vórtice</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  #v { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #bar { position: fixed; left: 0; right: 0; top: 0; padding: 10px 12px; display: flex; gap: 10px; flex-wrap: wrap;
         align-items: center; background: rgba(0,0,0,.68); transition: opacity .3s; font-size: 14px; }
  #bar.hide { opacity: 0; pointer-events: none; }
  button { background: #3c4043; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  button:active { background: #5f6368; }
  input[type=range] { vertical-align: middle; width: 140px; }
  #st { opacity: .8; margin-left: auto; }
</style>
</head>
<body>
<img id="v" alt="">
<div id="bar">
  <b>Vórtice</b>
  <button id="fs">Pantalla completa</button>
  <button id="au" hidden>🔊 Activar audio</button>
  <button id="rc" hidden>⏺ Grabar aquí</button>
  <label id="dl" hidden>Sincronía de audio
    <input id="delay" type="range" min="0" max="3000" step="100" value="0">
    <span id="dv">0 ms</span>
  </label>
  <span id="st">Conectando…</span>
</div>
<audio id="a"></audio>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var k = encodeURIComponent(q.get('k') || '');
  var v = document.getElementById('v'), bar = document.getElementById('bar'), st = document.getElementById('st');
  var au = document.getElementById('au'), a = document.getElementById('a'), dl = document.getElementById('dl');
  var delay = document.getElementById('delay'), dv = document.getElementById('dv'), fs = document.getElementById('fs');
  var delayMs = 0, audioOn = false, ok = true, hideTimer = null;

  try { delayMs = parseInt(localStorage.getItem('vortice_delay') || '0', 10) || 0; } catch (e) {}
  delay.value = delayMs; dv.textContent = delayMs + ' ms';

  function startVideo() { v.src = '/video?k=' + k + '&delay=' + delayMs + '&t=' + Date.now(); }
  function startAudio() { a.src = '/audio?k=' + k + '&t=' + Date.now(); var p = a.play(); if (p && p.catch) p.catch(function () {}); }

  function ping() {
    fetch('/info?k=' + k, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('x'); return r.json(); })
      .then(function (j) {
        st.textContent = 'En vivo';
        if (j.audio) au.hidden = false;
        if (!ok) { ok = true; startVideo(); if (audioOn) startAudio(); }
      })
      .catch(function () { ok = false; st.textContent = 'Sin conexión…'; });
  }

  au.onclick = function () {
    audioOn = !audioOn;
    if (audioOn) { startAudio(); au.textContent = '🔇 Silenciar audio'; dl.hidden = false; }
    else { a.pause(); a.removeAttribute('src'); a.load(); au.textContent = '🔊 Activar audio'; }
  };
  delay.oninput = function () { dv.textContent = delay.value + ' ms'; };
  delay.onchange = function () {
    delayMs = parseInt(delay.value, 10) || 0;
    try { localStorage.setItem('vortice_delay', String(delayMs)); } catch (e) {}
    startVideo();
  };
  fs.onclick = function () {
    var d = document, el = d.documentElement;
    if (d.fullscreenElement) { d.exitFullscreen(); }
    else if (el.requestFullscreen) { el.requestFullscreen(); }
  };

  // ---- Grabar lo que se recibe, en este mismo navegador (se guarda como .webm)
  var rc = document.getElementById('rc');
  var rec = null, chunks = [], canvas = null, ctx = null, drawTimer = null, tickTimer = null, t0 = 0, starting = false;
  if (window.MediaRecorder && HTMLCanvasElement.prototype.captureStream) rc.hidden = false;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function pickType() {
    var c = ['video/webm;codecs=h264,opus', 'video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9,opus', 'video/webm'];
    for (var i = 0; i < c.length; i++) { if (MediaRecorder.isTypeSupported(c[i])) return c[i]; }
    return '';
  }
  function drawFrame() {
    if (!v.naturalWidth) return;
    if (canvas.width !== v.naturalWidth || canvas.height !== v.naturalHeight) {
      canvas.width = v.naturalWidth; canvas.height = v.naturalHeight;
    }
    ctx.drawImage(v, 0, 0);
  }
  function tick() {
    var s = Math.floor((Date.now() - t0) / 1000);
    rc.textContent = '⏹ Detener y guardar  ' + pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  }
  function begin(audioStream) {
    canvas = document.createElement('canvas');
    canvas.width = v.naturalWidth || 640; canvas.height = v.naturalHeight || 360;
    ctx = canvas.getContext('2d');
    drawFrame();
    var stream = canvas.captureStream(15);
    if (audioStream) { audioStream.getAudioTracks().forEach(function (t) { stream.addTrack(t); }); }
    var type = pickType();
    var opts = { videoBitsPerSecond: 2500000, audioBitsPerSecond: 96000 };
    if (type) opts.mimeType = type;
    try { rec = new MediaRecorder(stream, opts); }
    catch (e) { st.textContent = 'Este navegador no puede grabar'; starting = false; rc.textContent = '⏺ Grabar aquí'; return; }
    chunks = [];
    rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = saveRec;
    rec.start(1000);
    drawTimer = setInterval(drawFrame, 1000 / 15);
    t0 = Date.now();
    tickTimer = setInterval(tick, 500);
    tick();
    starting = false;
  }
  function startRec() {
    if (starting) return;
    starting = true;
    rc.textContent = 'Preparando…';
    var wantAudio = !au.hidden;
    if (wantAudio && !audioOn) au.click();   // el clic cuenta como gesto del usuario para poder reproducir audio
    if (!wantAudio || !a.captureStream) { begin(null); return; }
    var as = null;
    try { as = a.captureStream(); } catch (e) { as = null; }
    var tries = 0;
    (function wait() {
      if (as && as.getAudioTracks().length > 0) { begin(as); }
      else if (++tries > 30) { begin(null); }   // si el audio no llega en 3 s, se graba solo el video
      else { setTimeout(wait, 100); }
    })();
  }
  function stopRec() {
    clearInterval(drawTimer); clearInterval(tickTimer);
    try { rec.stop(); } catch (e) {}
    rc.textContent = '⏺ Grabar aquí';
  }
  function saveRec() {
    var blob = new Blob(chunks, { type: (rec && rec.mimeType) || 'video/webm' });
    var d = new Date();
    var name = 'Vortice_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' +
               pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '.webm';
    var l = document.createElement('a');
    l.href = URL.createObjectURL(blob); l.download = name;
    document.body.appendChild(l); l.click();
    setTimeout(function () { URL.revokeObjectURL(l.href); l.remove(); }, 4000);
    rec = null; chunks = [];
    st.textContent = 'Guardado: ' + name;
  }
  rc.onclick = function () { if (rec) stopRec(); else startRec(); };

  function showBar() {
    bar.classList.remove('hide');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { bar.classList.add('hide'); }, 4000);
  }
  ['pointerdown', 'pointermove', 'keydown'].forEach(function (ev) { window.addEventListener(ev, showBar); });
  showBar();

  startVideo();
  ping();
  setInterval(ping, 3000);
})();
</script>
</body>
</html>
